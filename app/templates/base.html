<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo_pagina | default('Gestão de Processos') }}</title>
    <!-- CSS do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS customizado -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">
            <i class="fas fa-archive"></i>
            <span>Gestão Arquivo</span>
        </div>
        <ul class="sidebar-nav">
            <li class="nav-item">
                <a class="nav-link active" href="/processos">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/processos/cadastrar">
                    <i class="fas fa-plus-circle"></i>
                    <span>Novo Processo</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/processos/retirada">
                    <i class="fas fa-file-export"></i>
                    <span>Retirada</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/processos/devolucao">
                    <i class="fas fa-file-import"></i>
                    <span>Devolução</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/relatorios">
                    <i class="fas fa-chart-bar"></i>
                    <span>Relatórios</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Topbar -->
    <div class="topbar">
        <div class="page-info">
            <h5 class="mb-0">{{ titulo_pagina | default('Dashboard') }}</h5>
        </div>
        <div class="user-actions d-flex align-items-center gap-3">
            <div class="notifications text-muted">
                <i class="fas fa-bell"></i>
            </div>
            <div class="user-info">
                <span>Admin</span>
                <img src="https://ui-avatars.com/api/?name=Admin&background=1A237E&color=fff" alt="User" class="rounded-circle" width="32">
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        {% if request.query_params.get("msg") %}
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                {{ request.query_params.get("msg") }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <!-- JS do Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Set active nav link based on current path
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('href') === window.location.pathname) {
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            }
        });
    </script>
</body>
</html>
