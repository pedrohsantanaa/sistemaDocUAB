{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <ul class="nav nav-tabs" id="configTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="tipos-tab" data-bs-toggle="tab" data-bs-target="#tipos" type="button" role="tab" aria-controls="tipos" aria-selected="true">Tipos de Processo</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="setores-tab" data-bs-toggle="tab" data-bs-target="#setores" type="button" role="tab" aria-controls="setores" aria-selected="false">Setores</button>
                        </li>
                    </ul>
                    <div class="tab-content mt-4" id="configTabsContent">
                        <!-- Tipos de Processo -->
                        <div class="tab-pane fade show active" id="tipos" role="tabpanel" aria-labelledby="tipos-tab">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5>Gerenciar Tipos de Processo</h5>
                                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTipo">
                                    <i class="fas fa-plus me-1"></i> Novo Tipo
                                </button>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Nome</th>
                                            <th class="text-end">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {% for tipo in tipos %}
                                        <tr>
                                            <td>{{ tipo.nome }}</td>
                                            <td class="text-end">
                                                <button class="btn btn-sm btn-outline-secondary me-1" onclick="editarTipo({{ tipo.id }}, '{{ tipo.nome }}')">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                                <a href="/configuracoes/tipos/deletar/{{ tipo.id }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Tem certeza que deseja excluir este tipo?')">
                                                    <i class="fas fa-trash"></i>
                                                </a>
                                            </td>
                                        </tr>
                                        {% endfor %}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Setores -->
                        <div class="tab-pane fade" id="setores" role="tabpanel" aria-labelledby="setores-tab">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5>Gerenciar Setores</h5>
                                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalSetor">
                                    <i class="fas fa-plus me-1"></i> Novo Setor
                                </button>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Nome</th>
                                            <th class="text-end">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {% for setor in setores %}
                                        <tr>
                                            <td>{{ setor.nome }}</td>
                                            <td class="text-end">
                                                <button class="btn btn-sm btn-outline-secondary me-1" onclick="editarSetor({{ setor.id }}, '{{ setor.nome }}')">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                                <a href="/configuracoes/setores/deletar/{{ setor.id }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Tem certeza que deseja excluir este setor?')">
                                                    <i class="fas fa-trash"></i>
                                                </a>
                                            </td>
                                        </tr>
                                        {% endfor %}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Tipo de Processo -->
<div class="modal fade" id="modalTipo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formTipo" method="POST" action="/configuracoes/tipos">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModalTipo">Novo Tipo de Processo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="tipo_id" id="tipo_id">
                    <div class="mb-3">
                        <label for="nome_tipo" class="form-label">Nome do Tipo</label>
                        <input type="text" class="form-control" id="nome_tipo" name="nome" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Setor -->
<div class="modal fade" id="modalSetor" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formSetor" method="POST" action="/configuracoes/setores">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModalSetor">Novo Setor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="setor_id" id="setor_id">
                    <div class="mb-3">
                        <label for="nome_setor" class="form-label">Nome do Setor</label>
                        <input type="text" class="form-control" id="nome_setor" name="nome" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function editarTipo(id, nome) {
        document.getElementById('tituloModalTipo').innerText = 'Editar Tipo de Processo';
        document.getElementById('tipo_id').value = id;
        document.getElementById('nome_tipo').value = nome;
        document.getElementById('formTipo').action = '/configuracoes/tipos/editar/' + id;
        new bootstrap.Modal(document.getElementById('modalTipo')).show();
    }

    function editarSetor(id, nome) {
        document.getElementById('tituloModalSetor').innerText = 'Editar Setor';
        document.getElementById('setor_id').value = id;
        document.getElementById('nome_setor').value = nome;
        document.getElementById('formSetor').action = '/configuracoes/setores/editar/' + id;
        new bootstrap.Modal(document.getElementById('modalSetor')).show();
    }

    // Reset modals on close
    document.getElementById('modalTipo').addEventListener('hidden.bs.modal', function () {
        document.getElementById('tituloModalTipo').innerText = 'Novo Tipo de Processo';
        document.getElementById('tipo_id').value = '';
        document.getElementById('nome_tipo').value = '';
        document.getElementById('formTipo').action = '/configuracoes/tipos';
    });

    document.getElementById('modalSetor').addEventListener('hidden.bs.modal', function () {
        document.getElementById('tituloModalSetor').innerText = 'Novo Setor';
        document.getElementById('setor_id').value = '';
        document.getElementById('nome_setor').value = '';
        document.getElementById('formSetor').action = '/configuracoes/setores';
    });
</script>
{% endblock %}
