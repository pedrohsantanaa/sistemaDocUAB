<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema DocUAB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--primary-color);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .brand-login {
            text-align: center;
            margin-bottom: 30px;
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-login">
            <i class="fas fa-file-contract fa-3x mb-3"></i>
            <h3>DocUAB</h3>
            <p class="text-muted">Gestão de Processos Físicos</p>
        </div>

        {% if erro %}
        <div class="alert alert-danger" role="alert">
            {{ erro }}
        </div>
        {% endif %}

        <form action="/login" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="seu@email.com">
            </div>
            <div class="mb-4">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required placeholder="******">
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-rounded">Entrar</button>
        </form>
    </div>

    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
