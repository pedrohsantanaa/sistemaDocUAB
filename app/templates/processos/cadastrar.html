{% extends "base.html" %}

{% set titulo_pagina = "Cadastrar Novo Processo" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        {% if erro %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            {{ erro }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}

        <div class="card">
            <div class="card-body p-4">
                <div class="d-flex align-items-center mb-4">
                    <div class="stats-icon bg-info-light me-3">
                        <i class="fas fa-file-medical text-primary"></i>
                    </div>
                    <h5 class="card-title mb-0">Informações do Processo</h5>
                </div>
                
                <form action="/processos/cadastrar" method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nome_cliente" class="form-label text-muted">Nome do Cliente</label>
                            <input type="text" class="form-control" id="nome_cliente" name="nome_cliente" placeholder="Nome completo" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="cpf_cnpj" class="form-label text-muted">CPF/CNPJ</label>
                            <input type="text" class="form-control" id="cpf_cnpj" name="cpf_cnpj" placeholder="000.000.000-00" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="numero_contrato" class="form-label text-muted">Número do Contrato</label>
                            <input type="text" class="form-control" id="numero_contrato" name="numero_contrato" placeholder="Ex: CTR-2023-001" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="tipo_processo" class="form-label text-muted">Tipo de Processo</label>
                            <input type="text" class="form-control" id="tipo_processo" name="tipo_processo" placeholder="Ex: Administrativo" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="setor_responsavel" class="form-label text-muted">Setor Responsável</label>
                            <input type="text" class="form-control" id="setor_responsavel" name="setor_responsavel" placeholder="Ex: Jurídico" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="status" class="form-label text-muted">Status Inicial</label>
                            <select class="form-select" id="status" name="status">
                                <option value="Disponível">Disponível</option>
                                <option value="Pendente">Pendente</option>
                                <option value="Liquidado">Liquidado</option>
                                <option value="Arquivado">Arquivado</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="/processos" class="btn btn-outline-secondary btn-rounded">Cancelar</a>
                        <button type="submit" class="btn btn-primary btn-rounded px-4">
                            <i class="fas fa-save me-2"></i>Cadastrar Processo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
