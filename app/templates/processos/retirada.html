{% extends "base.html" %}

{% set titulo_pagina = "Registrar Retirada" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        {% if erro %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            {{ erro }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}

        <div class="card">
            <div class="card-body p-4">
                <div class="d-flex align-items-center mb-4">
                    <div class="stats-icon bg-warning-light me-3">
                        <i class="fas fa-file-export text-warning"></i>
                    </div>
                    <h5 class="card-title mb-0">Nova Movimentação de Saída</h5>
                </div>
                
                <form action="/processos/movimentar/retirada" method="POST">
                    <div class="mb-3">
                        <label for="processo_id" class="form-label text-muted">Código do Processo</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="fas fa-barcode text-muted"></i>
                            </span>
                            <input type="number" class="form-control border-start-0" id="processo_id" name="processo_id" value="{{ processo_id or '' }}" placeholder="Digite o ID" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="setor_destino" class="form-label text-muted">Setor de Destino</label>
                        <input type="text" class="form-control" id="setor_destino" name="setor_destino" placeholder="Ex: Contabilidade" required>
                    </div>
                    <div class="mb-3">
                        <label for="observacoes" class="form-label text-muted">Observações</label>
                        <textarea class="form-control" id="observacoes" name="observacoes" rows="3" placeholder="Motivo da retirada ou detalhes adicionais..."></textarea>
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="/processos" class="btn btn-outline-secondary btn-rounded">Voltar</a>
                        <button type="submit" class="btn btn-warning btn-rounded px-4 text-dark fw-bold">
                            <i class="fas fa-check me-2"></i>Confirmar Retirada
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
