{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">Cadastrar Novo Usuário</h4>
                
                {% if erro %}
                <div class="alert alert-danger">{{ erro }}</div>
                {% endif %}

                <form action="/usuarios/cadastrar" method="post">
                    <div class="mb-3">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" name="nome" class="form-control" required placeholder="Ex: João Silva">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" name="email" class="form-control" required placeholder="joao@exemplo.com">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control" required placeholder="******">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Cargo / Nível de Acesso</label>
                        <select name="cargo" class="form-select">
                            <option value="usuario">Usuário Comum</option>
                            <option value="admin">Administrador</option>
                        </select>
                        <div class="form-text">Administradores podem gerenciar usuários e ver relatórios.</div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-rounded">Salvar Usuário</button>
                        <a href="/usuarios" class="btn btn-light btn-rounded">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
