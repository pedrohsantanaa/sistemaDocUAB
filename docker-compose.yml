services:
  db:
    image: postgres:15-alpine
    container_name: sistema_processos_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sistemadocuab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistemadocuab"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: sistema_processos_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      - db

  web:
    build: .
    container_name: sistema_processos_web
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sistemadocuab
    env_file:
      - .env
    volumes:
      - frontend_data:/app/static_dist
    restart: always

  nginx:
    image: nginx:alpine
    container_name: sistema_processos_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_data:/usr/share/nginx/html:ro
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  frontend_data:
