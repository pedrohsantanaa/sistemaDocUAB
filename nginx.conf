server {
        listen 80;
       server_name sgd.fomento.to.gov.br 10.99.0.53;
   
         # Necessário para renovação do certificado Let's Encrypt
         location /.well-known/acme-challenge/ {
             root /var/www/certbot;
         }
    
        # Redirecionar todo tráfego HTTP para HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
   
    server {
        listen 443 ssl;
        server_name sgd.fomento.to.gov.br;
   
        # Caminhos dos certificados (mapeados via Docker)
        ssl_certificate /etc/letsencrypt/live/sgd.fomento.to.gov.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sgd.fomento.to.gov.br/privkey.pem;
   
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
   
        # Gzip Compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
   
        # Frontend (Arquivos estáticos)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
   
        # Backend API
        location /api {
            proxy_pass http://web:8000/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
   
        # Autenticação
        location /login {
            proxy_pass http://web:8000/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
	
	# Acesso ao pgAdmin via Nginx
         location /pgadmin/ {
             proxy_pass http://pgadmin:80/;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
    
             # Importante para o pgAdmin não perder a referência da URL
            proxy_set_header X-Script-Name /pgadmin;
            proxy_redirect off;
        }   
        # Cabeçalhos de Segurança
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
