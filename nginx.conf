server {
    listen 80;
    server_name localhost;

    # Proxy puro: o FastAPI serve o SPA (app/main.py) e a API.
    # Assim, todo rebuild da imagem é refletido imediatamente,
    # sem volumes de estáticos entre containers.
    # Cabeçalhos de segurança (V06) são adicionados pelo próprio
    # FastAPI (middleware em app/main.py) — não duplicar aqui.
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
